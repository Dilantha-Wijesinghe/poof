[workspace]
resolver = "3"
members = ["crates/poof-core", "crates/poof-app", "xtask"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Dilantha Wijesinghe"]
repository = "https://github.com/Dilantha-Wijesinghe/poof"
homepage = "https://github.com/Dilantha-Wijesinghe/poof"
keywords = ["macos", "disk-usage", "cleaner", "storage", "treemap"]
categories = ["filesystem", "command-line-utilities"]

[workspace.dependencies]
poof-core = { path = "crates/poof-core", version = "0.1.1" }
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "smol", "canvas", "svg", "advanced"] }
jiff = "0.2"
minisign = "0.10"
minisign-verify = "0.3"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSURL", "NSString", "NSDictionary", "NSValue", "NSError", "NSArray", "NSFileManager", "NSObject", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
needless_pass_by_value = "allow"
bool_to_int_with_if = "allow"
float_cmp = "allow"
unreadable_literal = "allow" # hex colour codes read best unseparated

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
