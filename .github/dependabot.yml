version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      iced:
        patterns: ["iced*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Its version tags are Rust toolchains; the MSRV job pins one on purpose.
      - dependency-name: dtolnay/rust-toolchain
