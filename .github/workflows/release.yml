name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the crate version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="poof"))')"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Test
        run: cargo test --workspace --locked

      # The upstream prebuilt binary, pinned by checksum. Building it from
      # source with `cargo install` took about four minutes.
      - name: Install rcodesign
        env:
          RCODESIGN_VERSION: 0.29.0
          RCODESIGN_SHA256: d98372d5524226ccf9dc0eda03d4e4f5826182dabb2fc3f2bd303ed9113a748d
        run: |
          name="apple-codesign-$RCODESIGN_VERSION-macos-universal"
          curl -fsSL -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$RCODESIGN_VERSION/$name.tar.gz"
          echo "$RCODESIGN_SHA256  $RUNNER_TEMP/$name.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

      # Signing with Poof's own certificate keeps the app's identity stable, so
      # macOS remembers Full Disk Access across updates. Never ship without it.
      - name: Load the code-signing certificate
        env:
          P12: ${{ secrets.POOF_CODESIGN_P12 }}
          P12_PASSWORD: ${{ secrets.POOF_CODESIGN_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::Missing POOF_CODESIGN_P12 / POOF_CODESIGN_P12_PASSWORD secrets"; exit 1
          fi
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/codesign.p12"
          printf '%s' "$P12_PASSWORD" > "$RUNNER_TEMP/codesign-password.txt"
          echo "POOF_CODESIGN_P12=$RUNNER_TEMP/codesign.p12" >> "$GITHUB_ENV"
          echo "POOF_CODESIGN_PASSWORD_FILE=$RUNNER_TEMP/codesign-password.txt" >> "$GITHUB_ENV"

      - name: Build universal app
        run: scripts/bundle.sh

      # The in-app updater only installs archives signed with this key.
      - name: Sign the update archive
        env:
          POOF_UPDATE_SIGNING_KEY: ${{ secrets.POOF_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$POOF_UPDATE_SIGNING_KEY" ]; then
            echo "::error::Missing POOF_UPDATE_SIGNING_KEY secret"; exit 1
          fi
          cargo xtask sign "dist/Poof-${GITHUB_REF_NAME#v}.zip"

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/codesign.p12" "$RUNNER_TEMP/codesign-password.txt"

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Wrapped bullets are joined onto one line: Poof 0.1.0 and 0.1.1 show only
          # the first line of each bullet in their update dialog.
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            !found { next }
            bullet && /^[ \t]+[^ \t]/ && !/^[ \t]*[-*] / { sub(/^[ \t]+/, ""); line = line " " $0; next }
            { if (held) print line; line = $0; held = 1; bullet = /^[ \t]*[-*] / }
            END { if (held) print line }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Install
          Already using Poof? It will offer this update by itself.
          New here? Download `Poof-*.dmg`, drag Poof to Applications, then run
          `xattr -dr com.apple.quarantine /Applications/Poof.app` (the app is not notarized yet).
          Verify downloads with `SHA256SUMS.txt`.
          NOTES

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Poof ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            dist/*.dmg dist/*.zip dist/*.zip.minisig dist/SHA256SUMS.txt
