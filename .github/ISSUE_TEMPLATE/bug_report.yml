name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If Poof deleted or offered to delete something it shouldn't have, please report it **privately**. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Poof version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 26.4, MacBook Air M4"
    validations:
      required: true
  - type: dropdown
    id: fda
    attributes:
      label: Full Disk Access granted?
      options: ["Yes", "No", "Not sure"]
