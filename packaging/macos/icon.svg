<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- macOS app icon: frosted tile on Apple's 824px icon grid with the Poof mark. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f3f5ff"/>
      <stop offset="1" stop-color="#dfe6ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#9db8ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9db8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="14" result="blur"/>
      <feFlood flood-color="#3a4fb0" flood-opacity="0.32"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3"/>
  <image href="../../crates/poof-app/assets/brand/mark.svg" x="212" y="200" width="600" height="600"/>
</svg>
